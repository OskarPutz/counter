<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Counter">
<meta name="theme-color" content="#fafaf9">
<title>Clothing Counter</title>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="40" fill="%231c1917"/><g stroke="white" stroke-width="11" stroke-linecap="round" fill="none"><line x1="55" y1="55" x2="55" y2="125"/><line x1="78" y1="55" x2="78" y2="125"/><line x1="101" y1="55" x2="101" y2="125"/><line x1="124" y1="55" x2="124" y2="125"/></g><line x1="42" y1="115" x2="138" y2="65" stroke="%23fbbf24" stroke-width="11" stroke-linecap="round"/></svg>'>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #fafaf9;
    color: #1c1917;
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
  }
  button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; padding: 0; }
  input { font: inherit; color: inherit; }

  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .uppercase-eyebrow {
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.2em;
    color: #78716c;
  }

  .header {
    position: sticky; top: 0; z-index: 10;
    background: #fafaf9;
    padding-top: env(safe-area-inset-top);
  }
  .header-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 16px 12px;
  }
  .header-totals { min-width: 0; }
  .totals-line {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 24px; font-weight: 700;
    margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .totals-sep { color: #d6d3d1; font-weight: 400; margin: 0 6px; }
  .csv-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    background: #1c1917; color: white;
    font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    border-radius: 6px;
    transition: transform 0.1s;
    flex-shrink: 0;
  }
  .csv-btn:active { transform: scale(0.95); }
  .csv-btn:disabled { opacity: 0.25; }

  .tabs {
    display: flex;
    border-top: 1px solid #e7e5e4;
    border-bottom: 1px solid #e7e5e4;
  }
  .tab {
    flex: 1; padding: 14px 0;
    font-size: 14px; font-weight: 700;
    text-transform: capitalize;
    color: #78716c;
    transition: background 0.15s, color 0.15s;
  }
  .tab.active { background: #1c1917; color: white; }
  .tab:active:not(.active) { background: #f5f5f4; }

  .subtabs {
    display: flex; gap: 6px;
    padding: 10px 12px;
    overflow-x: auto;
    background: #f5f5f4;
    border-bottom: 1px solid #e7e5e4;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .subtabs::-webkit-scrollbar { display: none; }
  .chip {
    padding: 6px 14px;
    font-size: 12px; font-weight: 700;
    text-transform: capitalize;
    white-space: nowrap;
    border-radius: 999px;
    background: white;
    color: #78716c;
    border: 1px solid #e7e5e4;
    transition: all 0.15s;
  }
  .chip.active {
    background: #fbbf24;
    color: #1c1917;
    border-color: #fbbf24;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .section-stats {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    background: white;
    border-bottom: 1px solid #e7e5e4;
    font-size: 12px;
  }
  .section-stats .label { color: #78716c; }
  .section-stats .num { color: #1c1917; font-weight: 700; }

  .list { padding: 12px; padding-bottom: 130px; padding-bottom: calc(130px + env(safe-area-inset-bottom)); }
  .list > * + * { margin-top: 8px; }

  .empty {
    text-align: center; padding: 80px 16px 16px;
  }
  .empty-sub { color: #a8a29e; font-size: 14px; margin-bottom: 4px; }
  .empty-title {
    color: #44403c; font-size: 16px; font-weight: 700;
    text-transform: capitalize; margin-bottom: 24px;
  }
  .add-first {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 12px 20px;
    background: #1c1917; color: white;
    font-size: 14px; font-weight: 700;
    border-radius: 10px;
    transition: transform 0.1s;
  }
  .add-first:active { transform: scale(0.95); }

  .item {
    display: flex; align-items: stretch;
    background: white;
    border: 2px solid #e7e5e4;
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.15s;
  }
  .item.tapped { border-color: #fbbf24; transform: scale(0.99); }
  .item-main {
    flex: 1; min-width: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px;
    transition: background 0.1s;
  }
  .item-main:active { background: #fef3c7; }
  .item-price {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 20px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .item-count {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 30px; font-weight: 900;
    margin-left: 12px;
    transition: color 0.15s;
  }
  .item.tapped .item-count { color: #f59e0b; }

  .item-actions {
    display: flex; flex-direction: column;
    border-left: 2px solid #e7e5e4;
    flex-shrink: 0;
  }
  .item-action {
    flex: 1; padding: 0 14px;
    display: flex; align-items: center; justify-content: center;
    color: #1c1917;
    transition: background 0.1s, color 0.15s;
    min-height: 36px;
  }
  .item-action.dec:active { background: #f5f5f4; }
  .item-action.del { color: #a8a29e; border-top: 2px solid #e7e5e4; }
  .item-action.del:active { background: #f5f5f4; }
  .item-action.del.pending {
    background: #ef4444; color: white; border-top-color: #ef4444;
  }

  .fab {
    position: fixed; left: 12px; right: 12px;
    bottom: 20px;
    bottom: calc(20px + env(safe-area-inset-bottom));
    padding: 16px;
    background: #1c1917; color: white;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 15px; font-weight: 700;
    transition: transform 0.1s;
    z-index: 5;
  }
  .fab:active { transform: scale(0.98); }

  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 20;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 12px;
    padding-bottom: calc(12px + env(safe-area-inset-bottom));
  }
  @media (min-width: 640px) { .modal-backdrop { align-items: center; } }
  .modal {
    background: white;
    border-radius: 16px;
    width: 100%; max-width: 380px;
    padding: 20px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
  }
  .modal-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-title { font-size: 16px; font-weight: 700; text-transform: capitalize; margin-top: 2px; }
  .modal-close {
    padding: 6px; margin: -6px;
    color: #78716c;
    border-radius: 6px;
    transition: background 0.1s;
  }
  .modal-close:active { background: #f5f5f4; }

  .price-input-wrap { position: relative; }
  .price-input {
    width: 100%;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    font-size: 30px; font-weight: 700;
    text-align: center;
    padding: 16px 56px 16px 16px;
    border: 2px solid #e7e5e4;
    border-radius: 12px;
    background: white;
    outline: none;
    transition: border-color 0.15s;
  }
  .price-input:focus { border-color: #fbbf24; }
  .price-suffix {
    position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
    color: #a8a29e;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-weight: 700;
    pointer-events: none;
  }
  .modal-submit {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: #fbbf24; color: #1c1917;
    border-radius: 12px;
    font-size: 15px; font-weight: 700;
    transition: transform 0.1s, opacity 0.15s, background 0.15s;
  }
  .modal-submit:active { transform: scale(0.98); }
  .modal-submit:disabled { opacity: 0.4; background: #e7e5e4; }
  .modal-hint {
    text-align: center;
    font-size: 12px;
    color: #78716c;
    margin-top: 12px;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="header-totals">
      <div class="uppercase-eyebrow">Counter</div>
      <div class="totals-line" id="totals">0 <span class="totals-sep">·</span> 0,00 zł</div>
    </div>
    <button class="csv-btn" id="csvBtn" disabled>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      CSV
    </button>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="subtabs" id="subtabs"></div>
  <div class="section-stats hidden" id="sectionStats">
    <span class="label"><span class="num mono" id="sectionCount">0</span> <span id="sectionLabel">pieces</span></span>
    <span class="num mono" id="sectionValue">0,00 zł</span>
  </div>
</div>

<div class="list" id="list"></div>

<button class="fab hidden" id="fab">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  Add price
</button>

<div class="modal-backdrop hidden" id="modal">
  <div class="modal" id="modalCard">
    <div class="modal-head">
      <div>
        <div class="uppercase-eyebrow">Add price</div>
        <div class="modal-title" id="modalTitle">dress · woven</div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="price-input-wrap">
      <input class="price-input" id="priceInput" type="text" inputmode="decimal" placeholder="159,99" autocomplete="off">
      <span class="price-suffix">zł</span>
    </div>
    <button class="modal-submit" id="modalSubmit" disabled>Add piece</button>
    <div class="modal-hint">Same price increments the existing counter</div>
  </div>
</div>

<script>
(() => {
  const CATEGORIES = {
    dress:    ['woven', 'knitted', 'jeans', 'knitwear'],
    shirt:    ['woven', 'jeans'],
    trousers: ['woven', 'knitted', 'knitwear'],
  };
  const STORAGE_KEY = 'clothing-counter-v1';

  // ---------- state ----------
  let items = [];
  let category = 'dress';
  let subcategory = 'woven';
  let pendingDelete = null;
  let pendingDeleteTimer = null;
  let tappedId = null;
  let tappedTimer = null;

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) items = JSON.parse(raw);
  } catch (e) { /* ignore corrupted */ }

  const save = () => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    catch (e) { /* quota or private mode */ }
  };

  const uid = () =>
    (crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now().toString(36) + Math.random().toString(36).slice(2);

  const buzz = (ms = 8) => {
    if (navigator.vibrate) navigator.vibrate(ms);
  };

  const fmtPrice = (n) =>
    new Intl.NumberFormat('pl-PL', {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2,
    }).format(n) + ' zł';

  // ---------- DOM refs ----------
  const $ = (id) => document.getElementById(id);
  const tabsEl = $('tabs');
  const subtabsEl = $('subtabs');
  const listEl = $('list');
  const fabEl = $('fab');
  const totalsEl = $('totals');
  const csvBtn = $('csvBtn');
  const sectionStatsEl = $('sectionStats');
  const sectionCountEl = $('sectionCount');
  const sectionLabelEl = $('sectionLabel');
  const sectionValueEl = $('sectionValue');
  const modalEl = $('modal');
  const modalCardEl = $('modalCard');
  const modalCloseEl = $('modalClose');
  const modalTitleEl = $('modalTitle');
  const modalSubmitEl = $('modalSubmit');
  const priceInputEl = $('priceInput');

  // ---------- render ----------
  function renderTabs() {
    tabsEl.innerHTML = Object.keys(CATEGORIES).map(cat =>
      `<button class="tab${cat === category ? ' active' : ''}" data-cat="${cat}">${cat}</button>`
    ).join('');
  }

  function renderSubtabs() {
    subtabsEl.innerHTML = CATEGORIES[category].map(sub =>
      `<button class="chip${sub === subcategory ? ' active' : ''}" data-sub="${sub}">${sub}</button>`
    ).join('');
  }

  function renderTotals() {
    const grandCount = items.reduce((s, i) => s + i.count, 0);
    const grandValue = items.reduce((s, i) => s + i.count * i.price, 0);
    totalsEl.innerHTML =
      `${grandCount} <span class="totals-sep">·</span> ${fmtPrice(grandValue)}`;
    csvBtn.disabled = items.length === 0;
  }

  function renderSection() {
    const visible = items
      .filter(i => i.category === category && i.subcategory === subcategory)
      .sort((a, b) => a.price - b.price);

    const sectionCount = visible.reduce((s, i) => s + i.count, 0);
    const sectionValue = visible.reduce((s, i) => s + i.count * i.price, 0);

    if (sectionCount > 0) {
      sectionStatsEl.classList.remove('hidden');
      sectionCountEl.textContent = sectionCount;
      sectionLabelEl.textContent = sectionCount === 1 ? 'piece' : 'pieces';
      sectionValueEl.textContent = fmtPrice(sectionValue);
    } else {
      sectionStatsEl.classList.add('hidden');
    }

    if (visible.length === 0) {
      fabEl.classList.add('hidden');
      listEl.innerHTML = `
        <div class="empty">
          <div class="empty-sub">No prices yet for</div>
          <div class="empty-title">${category} · ${subcategory}</div>
          <button class="add-first" id="addFirst">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Add first price
          </button>
        </div>`;
      $('addFirst').addEventListener('click', openModal);
      return;
    }

    fabEl.classList.remove('hidden');
    listEl.innerHTML = visible.map(item => `
      <div class="item${tappedId === item.id ? ' tapped' : ''}" data-id="${item.id}">
        <button class="item-main" data-action="inc">
          <span class="item-price mono">${fmtPrice(item.price)}</span>
          <span class="item-count mono">${item.count}</span>
        </button>
        <div class="item-actions">
          <button class="item-action dec" data-action="dec" aria-label="decrement">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <button class="item-action del${pendingDelete === item.id ? ' pending' : ''}" data-action="del" aria-label="delete">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </div>
    `).join('');
  }

  function renderAll() {
    renderTabs();
    renderSubtabs();
    renderTotals();
    renderSection();
  }

  // ---------- actions ----------
  function setCategory(cat) {
    category = cat;
    if (!CATEGORIES[category].includes(subcategory)) {
      subcategory = CATEGORIES[category][0];
    }
    pendingDelete = null;
    renderAll();
  }
  function setSubcategory(sub) {
    subcategory = sub;
    pendingDelete = null;
    renderAll();
  }

  function inc(id) {
    items = items.map(i => i.id === id ? { ...i, count: i.count + 1 } : i);
    save();
    tappedId = id;
    clearTimeout(tappedTimer);
    tappedTimer = setTimeout(() => { tappedId = null; renderSection(); }, 180);
    buzz(8);
    renderTotals();
    renderSection();
  }

  function dec(id) {
    items = items.map(i =>
      i.id === id ? { ...i, count: Math.max(0, i.count - 1) } : i
    );
    save();
    buzz(5);
    renderTotals();
    renderSection();
  }

  function tryDelete(id) {
    if (pendingDelete === id) {
      items = items.filter(i => i.id !== id);
      pendingDelete = null;
      clearTimeout(pendingDeleteTimer);
      save();
      buzz(20);
      renderTotals();
      renderSection();
    } else {
      pendingDelete = id;
      clearTimeout(pendingDeleteTimer);
      pendingDeleteTimer = setTimeout(() => {
        pendingDelete = null;
        renderSection();
      }, 2500);
      buzz(5);
      renderSection();
    }
  }

  function openModal() {
    modalTitleEl.textContent = `${category} · ${subcategory}`;
    priceInputEl.value = '';
    modalSubmitEl.disabled = true;
    modalEl.classList.remove('hidden');
    setTimeout(() => priceInputEl.focus(), 50);
  }
  function closeModal() {
    modalEl.classList.add('hidden');
    priceInputEl.blur();
  }

  function submitPrice() {
    const p = parseFloat(priceInputEl.value.replace(',', '.').trim());
    if (isNaN(p) || p < 0) return;
    const rounded = Math.round(p * 100) / 100;

    const existing = items.find(i =>
      i.category === category && i.subcategory === subcategory && i.price === rounded
    );
    if (existing) {
      items = items.map(i => i.id === existing.id ? { ...i, count: i.count + 1 } : i);
    } else {
      items.push({ id: uid(), category, subcategory, price: rounded, count: 1 });
    }
    save();
    closeModal();
    buzz(15);
    renderAll();
  }

  function exportCSV() {
    if (items.length === 0) return;
    const sorted = items.slice().sort((a, b) => {
      if (a.category !== b.category) return a.category.localeCompare(b.category);
      if (a.subcategory !== b.subcategory) return a.subcategory.localeCompare(b.subcategory);
      return a.price - b.price;
    });
    const header = 'category,subcategory,price,count,total\n';
    const rows = sorted.map(i =>
      `${i.category},${i.subcategory},${i.price.toFixed(2)},${i.count},${(i.count * i.price).toFixed(2)}`
    ).join('\n');
    const totalCount = items.reduce((s, i) => s + i.count, 0);
    const totalValue = items.reduce((s, i) => s + i.count * i.price, 0);
    const csv = header + rows + `\n,,,${totalCount},${totalValue.toFixed(2)}`;

    const date = new Date().toISOString().slice(0, 10);
    const filename = `clothing-${date}.csv`;
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });

    // Try Web Share API for iOS-friendly handoff (optional)
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
  }

  // ---------- events ----------
  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-cat]');
    if (btn) setCategory(btn.dataset.cat);
  });
  subtabsEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-sub]');
    if (btn) setSubcategory(btn.dataset.sub);
  });
  listEl.addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const itemEl = btn.closest('[data-id]');
    if (!itemEl) return;
    const id = itemEl.dataset.id;
    const action = btn.dataset.action;
    if (action === 'inc') inc(id);
    else if (action === 'dec') dec(id);
    else if (action === 'del') tryDelete(id);
  });

  fabEl.addEventListener('click', openModal);
  modalCloseEl.addEventListener('click', closeModal);
  modalEl.addEventListener('click', e => {
    if (e.target === modalEl) closeModal();
  });
  priceInputEl.addEventListener('input', () => {
    modalSubmitEl.disabled = priceInputEl.value.trim() === '';
  });
  priceInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') submitPrice();
  });
  modalSubmitEl.addEventListener('click', submitPrice);

  csvBtn.addEventListener('click', exportCSV);

  // initial render
  renderAll();
})();
</script>
</body>
</html>
